# Overlay for air-gapped / internal networks.
# Switches to Ubuntu base and routes packages through local proxies.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml build
#
# Configure these build args for your network:
#   APT_PROXY        — apt-cacher-ng URL (e.g. http://cache.local:3142)
#   PIP_INDEX_URL    — internal PyPI mirror
#   PIP_TRUSTED_HOST — hostname for the PyPI mirror
services:
  repo-map:
    image: repo-map:latest
    build:
      args:
        BASE_IMAGE: ubuntu:24.04
        APT_PACKAGES: "python3 python3-pip python3-venv git ca-certificates"
        # APT_PROXY: "http://your-apt-cache:3142"
        # PIP_INDEX_URL: "https://your-nexus/repository/pypi-proxy/simple/"
        # PIP_TRUSTED_HOST: your-nexus
