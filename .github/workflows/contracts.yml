name: Python contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "pydantic==2.13.5" "pytest>=8,<10"
      - name: Compile Python source
        run: python -m compileall -q schemas.py service.py agentic_mapper.py repo_map_generator.py
      - name: Run schema tests
        run: python -m pytest -q tests/test_schemas.py
